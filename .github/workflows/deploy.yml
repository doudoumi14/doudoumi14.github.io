name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push cancels an in-flight one rather than
# queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # This repo is mirrored to doudoumi14/portfolio-site as a code sample, and
    # only the user-pages repo actually publishes. The guard lets both carry an
    # identical file: elsewhere the job is skipped rather than failing.
    if: github.repository == 'doudoumi14/doudoumi14.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: github.repository == 'doudoumi14/doudoumi14.github.io'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
